name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check JSON and inline script syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node -e "const vm = require('vm'); const html = require('fs').readFileSync('index.html', 'utf8'); [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].forEach((m) => new vm.Script(m[1]))"
          node --check sw.js
          node --check tests/smoke.spec.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/

  database:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-database
      cancel-in-progress: false
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify the target is the test project
        run: |
          for name in TEST_DATABASE_URL TEST_SUPABASE_URL TEST_SUPABASE_ANON_KEY TEST_SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          const productionRef = 'wscprmtjjbevesrchhjr';
          const app = new URL(process.env.TEST_SUPABASE_URL);
          const match = app.hostname.toLowerCase().match(/^([a-z0-9_-]+)\.supabase\.co$/);
          if (!match) throw new Error('TEST_SUPABASE_URL must use <project-ref>.supabase.co');
          const ref = match[1];
          if (ref === productionRef) throw new Error('TEST_SUPABASE_URL points to production');
          const db = new URL(process.env.TEST_DATABASE_URL);
          if (!['postgres:', 'postgresql:'].includes(db.protocol)) throw new Error('TEST_DATABASE_URL must use PostgreSQL protocol');
          if (db.hostname.toLowerCase() === `db.${productionRef}.supabase.co` || decodeURIComponent(db.username).toLowerCase().endsWith(`.${productionRef}`)) throw new Error('TEST_DATABASE_URL points to production');
          if (!/^aws-\d+-[a-z0-9-]+\.pooler\.supabase\.com$/.test(db.hostname.toLowerCase()) || decodeURIComponent(db.username).toLowerCase() !== `postgres.${ref}`) throw new Error(`TEST_DATABASE_URL must use the IPv4-reachable test pooler and username postgres.${ref}`);
          console.log(`Verified dedicated test project: ${ref}`);
          NODE
      - name: Apply schema to the test database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Run database integration tests
        run: node tests/db.integration.mjs
